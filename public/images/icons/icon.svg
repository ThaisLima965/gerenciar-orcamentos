<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de Fundo Global PWA -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1017" />
      <stop offset="50%" stop-color="#181926" />
      <stop offset="100%" stop-color="#222436" />
    </linearGradient>

    <!-- Gradiente Roxo TKE Corporativo Vibrante -->
    <linearGradient id="tkePurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#6200EA" />
      <stop offset="100%" stop-color="#D80064" />
    </linearGradient>

    <!-- Sombra Suave -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#6200EA" flood-opacity="0.45" />
    </filter>

    <linearGradient id="whiteGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
  </defs>

  <!-- Fundo PWA -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Borda Sutil Externa -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#tkePurpleGrad)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Quadrado Arredondado Roxo Central com Sombra -->
  <g filter="url(#shadow)">
    <rect x="80" y="80" width="352" height="352" rx="84" fill="url(#tkePurpleGrad)" />
    
    <!-- Brilho Interno Superior -->
    <rect x="82" y="82" width="348" height="348" rx="82" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.3" />
  </g>

  <!-- Ilustração Vetorial de Orçamento (Documento com Cifrão, Saco de Dinheiro e Calculadora) -->
  <g transform="translate(136, 136) scale(2.4)" stroke="#FFFFFF" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- 1. Folha do Documento de Orçamento -->
    <path d="M12 14 C12 10.7 14.7 8 18 8 L50 8 C52.2 8 54 9.8 54 12 L54 66 C54 69.3 51.3 72 48 72 L18 72 C14.7 72 12 69.3 12 66 Z" stroke-width="3.5" fill="#FFFFFF" fill-opacity="0.08"/>
    
    <!-- Círculo e Símbolo do Cifrão ($) -->
    <circle cx="33" cy="22" r="8.5" stroke-width="3" fill="#FFFFFF" fill-opacity="0.15"/>
    <path d="M33 17.5 L33 26.5 M30.5 19.5 C30.5 18.2 31.8 17.8 33 17.8 C34.5 17.8 35.5 18.6 35.5 19.8 C35.5 21.2 33.8 21.7 32.5 22.2 C31.2 22.7 30.5 23.4 30.5 24.5 C30.5 25.6 31.8 26.2 33 26.2 C34.5 26.2 35.5 25.4 35.5 24.2" stroke-width="2.2" stroke="#FFFFFF" fill="none"/>

    <!-- Linhas do Orçamento -->
    <line x1="18" y1="36" x2="38" y2="36" stroke-width="3.5"/>
    <line x1="18" y1="44" x2="34" y2="44" stroke-width="3.5"/>
    <line x1="18" y1="52" x2="30" y2="52" stroke-width="3.5"/>
    <line x1="18" y1="60" x2="26" y2="60" stroke-width="3.5"/>

    <!-- 2. Saco de Dinheiro -->
    <!-- Topo / Babado do Saco -->
    <path d="M51 24 C48 20, 52 16, 56 19 C60 15, 64 19, 62 24" stroke-width="3" fill="#FFFFFF" fill-opacity="0.25"/>
    <!-- Laço / Amarração -->
    <rect x="49" y="24" width="15" height="4" rx="2" fill="#FFFFFF" stroke="none"/>
    <!-- Corpo do Saco -->
    <path d="M51 28 C41 35, 36 51, 41 64 C45 74, 60 76, 68 69 C74 63, 74 48, 62 28 Z" stroke-width="3.5" fill="#FFFFFF" fill-opacity="0.12"/>

    <!-- 3. Calculadora -->
    <!-- Corpo da Calculadora -->
    <rect x="54" y="46" width="36" height="46" rx="7" stroke-width="3.5" fill="#FFFFFF" fill-opacity="0.2"/>
    <!-- Visor / Display -->
    <rect x="61" y="52" width="22" height="9" rx="2.5" stroke-width="2.5" fill="#FFFFFF" fill-opacity="0.3"/>
    <!-- Teclas -->
    <rect x="61" y="65" width="5.5" height="4.5" rx="1.5" fill="#FFFFFF" stroke="none"/>
    <rect x="69.2" y="65" width="5.5" height="4.5" rx="1.5" fill="#FFFFFF" stroke="none"/>
    <rect x="77.5" y="65" width="5.5" height="4.5" rx="1.5" fill="#FFFFFF" stroke="none"/>

    <rect x="61" y="73" width="5.5" height="4.5" rx="1.5" fill="#FFFFFF" stroke="none"/>
    <rect x="69.2" y="73" width="5.5" height="4.5" rx="1.5" fill="#FFFFFF" stroke="none"/>
    <rect x="77.5" y="73" width="5.5" height="4.5" rx="1.5" fill="#FFFFFF" stroke="none"/>

    <rect x="61" y="81" width="5.5" height="4.5" rx="1.5" fill="#FFFFFF" stroke="none"/>
    <rect x="69.2" y="81" width="5.5" height="4.5" rx="1.5" fill="#FFFFFF" stroke="none"/>
    <rect x="77.5" y="81" width="5.5" height="4.5" rx="1.5" fill="#FFFFFF" stroke="none"/>
  </g>
</svg>