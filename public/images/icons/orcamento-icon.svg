    <path d="M51 24 C48 20, 52 16, 56 19 C60 15, 64 19, 62 24" stroke-width="3" fill="currentColor" fill-opacity="0.2"/>
    <!-- Laço / Amarração -->
    <rect x="49" y="24" width="15" height="4" rx="2" fill="currentColor" stroke="none"/>
    <!-- Corpo do Saco -->
    <path d="M51 28 C41 35, 36 51, 41 64 C45 74, 60 76, 68 69 C74 63, 74 48, 62 28 Z" stroke-width="3.5" fill="none"/>
  </g>

  <!-- Calculadora -->
  <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Corpo da Calculadora -->
    <rect x="54" y="46" width="36" height="46" rx="7" stroke-width="3.5" fill="currentColor" fill-opacity="0.15"/>
    <!-- Visor / Display -->
    <rect x="61" y="52" width="22" height="9" rx="2.5" stroke-width="2.5" fill="none"/>
    <!-- Teclas -->
    <rect x="61" y="65" width="5.5" height="4.5" rx="1.5" fill="currentColor" stroke="none"/>
    <rect x="69.2" y="65" width="5.5" height="4.5" rx="1.5" fill="currentColor" stroke="none"/>
    <rect x="77.5" y="65" width="5.5" height="4.5" rx="1.5" fill="currentColor" stroke="none"/>

    <rect x="61" y="73" width="5.5" height="4.5" rx="1.5" fill="currentColor" stroke="none"/>
    <rect x="69.2" y="73" width="5.5" height="4.5" rx="1.5" fill="currentColor" stroke="none"/>
    <rect x="77.5" y="73" width="5.5" height="4.5" rx="1.5" fill="currentColor" stroke="none"/>

    <rect x="61" y="81" width="5.5" height="4.5" rx="1.5" fill="currentColor" stroke="none"/>
    <rect x="69.2" y="81" width="5.5" height="4.5" rx="1.5" fill="currentColor" stroke="none"/>
    <rect x="77.5" y="81" width="5.5" height="4.5" rx="1.5" fill="currentColor" stroke="none"/>
