<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <!-- Documento de Orçamento -->
  <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Folha do Documento -->
    <path d="M12 14 C12 10.7 14.7 8 18 8 L50 8 C52.2 8 54 9.8 54 12 L54 66 C54 69.3 51.3 72 48 72 L18 72 C14.7 72 12 69.3 12 66 Z" stroke-width="3.5" fill="none"/>
    
    <!-- Círculo e Símbolo do Cifrão ($) -->
    <circle cx="33" cy="22" r="8.5" stroke-width="3" fill="none"/>
    <path d="M33 17.5 L33 26.5 M30.5 19.5 C30.5 18.2 31.8 17.8 33 17.8 C34.5 17.8 35.5 18.6 35.5 19.8 C35.5 21.2 33.8 21.7 32.5 22.2 C31.2 22.7 30.5 23.4 30.5 24.5 C30.5 25.6 31.8 26.2 33 26.2 C34.5 26.2 35.5 25.4 35.5 24.2" stroke-width="2" fill="none"/>

    <!-- Linhas de Itens do Orçamento -->
    <line x1="18" y1="36" x2="38" y2="36" stroke-width="3.5"/>
    <line x1="18" y1="44" x2="34" y2="44" stroke-width="3.5"/>
    <line x1="18" y1="52" x2="30" y2="52" stroke-width="3.5"/>
    <line x1="18" y1="60" x2="26" y2="60" stroke-width="3.5"/>
  </g>

  <!-- Saco de Dinheiro -->
